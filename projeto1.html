<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MarketLandia — ERP Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Biblioteca SheetJS para leitura direta da planilha Produtos.xlsx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --fg: #2c3038;
      --card: #ffffff;
      --mut: #7b818c;
      --bd: #e4e7ec;
      --pri: #d91e36;
      --pri-dark: #b31428;
      --pri-light: #fbe9eb;
      --ok: #2e9e49;
      --ok-bg: #e8f7ec;
      --warn: #e09f1f;
      --warn-bg: #fef6e6;
      --bad: #d91e36;
      --bad-bg: #fdebec;
      --dark-bar: #1f2124;
      --dark-hover: #2c2f33;
      --filter-bg: #e2e4e8;
      --font-sans: 'Raleway', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      display: grid;
      grid-template-rows: 58px 1fr;
      min-height: 100vh;
    }

    .topbar {
      background: var(--dark-bar);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 20px;
      border-bottom: 1px solid #141517;
      position: sticky;
      top: 0;
      z-index: 60;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      font-family: var(--font-sans);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      cursor: pointer;
    }

    .logo span {
      background: var(--pri);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .top-pills {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .pill-active {
      background: var(--pri);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(217, 30, 54, 0.35);
    }

    .pill-item {
      color: #b0b5bd;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .pill-item:hover {
      color: #fff;
    }

    .top-search {
      flex: 1;
      max-width: 520px;
      position: relative;
    }

    .top-search input {
      width: 100%;
      background: #2d3035;
      border: 1px solid #3c4047;
      color: #fff;
      border-radius: 20px;
      padding: 8px 16px 8px 36px;
      font-size: 13px;
    }

    .top-search input::placeholder {
      color: #8c929c;
    }

    .top-search input:focus {
      border-color: var(--pri);
      background: #25282c;
    }

    .top-search::before {
      content: "🔍";
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.65;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--pri);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.03em;
    }

    .user-info {
      line-height: 1.2;
      text-align: left;
    }

    .user-info small {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      color: #9aa0a9;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .user-info b {
      font-size: 13px;
      color: #fff;
    }

    .workspace {
      display: grid;
      grid-template-columns: 225px 1fr;
    }

    nav {
      background: var(--dark-bar);
      color: #b8bdc6;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid #dfe2e7;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
    }

    nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: #c4c9d1;
      transition: all 0.15s ease;
      user-select: none;
      border-left: 3px solid transparent;
    }

    nav a span.lbl {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    nav a span.arr {
      font-size: 11px;
      opacity: 0.5;
    }

    nav a:hover {
      background: var(--dark-hover);
      color: #fff;
    }

    nav a.on {
      background: var(--pri);
      color: #fff;
      font-weight: 700;
      border-left-color: #fff;
      border-radius: 0 22px 22px 0;
      margin-right: 10px;
      box-shadow: 0 4px 12px rgba(217, 30, 54, 0.35);
    }

    nav a.on span.arr {
      opacity: 1;
    }

    .nav-footer {
      padding: 14px 16px 4px;
      border-top: 1px solid #2e3136;
      margin-top: 16px;
    }

    .logout-btn {
      width: 100%;
      background: transparent;
      border: 1px solid #3e4249;
      color: #e4e7ec;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .logout-btn:hover {
      background: var(--pri);
      border-color: var(--pri);
      color: #fff;
    }

    main {
      padding: 28px 36px;
      min-width: 0;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    .page-head {
      border-bottom: 1px solid #d5d9e0;
      padding-bottom: 10px;
      margin-bottom: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-head small {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--mut);
      margin-bottom: 2px;
    }

    .page-head h2 {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 700;
      color: var(--pri);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .help-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #9aa0a9;
      color: #7b818c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      cursor: help;
    }

    .action-panel {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      margin-bottom: 22px;
      align-items: stretch;
    }

    .filter-box {
      background: var(--filter-bg);
      padding: 16px 20px;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-box label {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: #5a6069;
      letter-spacing: 0.05em;
    }

    .filter-input-wrap {
      background: #fff;
      border-radius: 3px;
      padding: 8px 14px;
      border: 1px solid #d0d4dc;
    }

    .filter-input-wrap input {
      border: none;
      padding: 0;
      width: 100%;
      background: transparent;
      font-size: 13px;
      color: var(--fg);
    }

    .filter-input-wrap input:focus {
      box-shadow: none;
    }

    .filter-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-active {
      background: var(--pri);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tag-dashed {
      border: 1px dashed var(--pri);
      color: var(--pri);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .tag-btn {
      background: #fff;
      border: 1px solid #cfd4dc;
      color: var(--fg);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tag-btn.on {
      background: var(--dark-bar);
      color: #fff;
      border-color: var(--dark-bar);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 54px 54px;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
    }

    .tool-btn {
      background: var(--filter-bg);
      border: none;
      color: var(--pri);
      border-radius: 3px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tool-btn:hover {
      background: #d5d8de;
    }

    .add-big-btn {
      background: var(--pri);
      color: #fff;
      border: none;
      border-radius: 3px;
      width: 135px;
      padding: 16px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
    }

    .add-big-btn:hover {
      background: var(--pri-dark);
    }

    .add-big-btn small {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.92;
    }

    .add-big-btn b {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-top: 2px;
    }

    input, select, button {
      font: inherit;
      padding: 8px 12px;
      border: 1px solid #cfd4dc;
      border-radius: 4px;
      background: #fff;
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--pri);
      box-shadow: 0 0 0 3px rgba(217, 30, 54, 0.12);
    }

    button {
      background: var(--pri);
      color: #fff;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    button:hover {
      background: var(--pri-dark);
    }

    button.secondary {
      background: #fff;
      color: var(--fg);
      border: 1px solid #cfd4dc;
    }

    button.secondary:hover {
      border-color: var(--pri);
      color: var(--pri);
      background: #fffafa;
    }

    button.dark-btn {
      background: var(--dark-bar);
      color: #fff;
    }

    button.dark-btn:hover {
      background: #34383d;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 14px;
      margin-bottom: 26px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-left: 4px solid var(--pri);
      border-radius: 4px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .card small {
      color: var(--mut);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
    }

    .card h3 {
      font-family: var(--font-serif);
      margin: 6px 0 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--fg);
    }

    .table-wrapper {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 4px;
      overflow-x: auto;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 2px solid var(--bd);
      color: #4a5058;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: #fafbfc;
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--bd);
      vertical-align: middle;
      white-space: nowrap;
      font-size: 13.5px;
    }

    tr:hover td {
      background: #fcfcfd;
    }

    tr.row-inactive td {
      opacity: 0.68;
      background: #fafafa;
    }

    td:first-child {
      border-left: 5px solid var(--pri);
      font-weight: 700;
    }

    .num-serif {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--pri);
      display: block;
      line-height: 1.1;
    }

    .sku-pill {
      font-family: monospace;
      font-size: 13px;
      font-weight: 800;
      background: #f0f2f5;
      color: #1f2124;
      border: 1px solid #d5d9e0;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      letter-spacing: 0.03em;
    }

    .sub-status {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--mut);
    }

    .dot-ok, .dot-warn, .dot-bad {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .dot-ok { color: var(--ok); }
    .dot-ok::after { content: "●"; font-size: 10px; }

    .dot-warn { color: var(--warn); }
    .dot-warn::after { content: "●"; font-size: 10px; }

    .dot-bad { color: var(--bad); }
    .dot-bad::after { content: "●"; font-size: 10px; }

    .badge-sim, .badge-nao {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-sim {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid rgba(46, 158, 73, 0.3);
    }

    .badge-nao {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid rgba(217, 30, 54, 0.3);
    }

    .mut { color: var(--mut); }
    .ok { color: var(--ok) !important; }
    .bad { color: var(--bad) !important; }

    label {
      display: block;
      margin: 10px 0 4px;
      color: #555b66;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-layout input, .form-layout select {
      width: 100%;
    }

    /* Barra de Ferramentas da Planilha no Catálogo */
    .sheet-bar {
      background: #fff;
      border: 1px solid var(--bd);
      border-left: 4px solid var(--dark-bar);
      border-radius: 4px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .sheet-bar-info strong {
      display: block;
      font-size: 13px;
      color: var(--fg);
    }

    .sheet-bar-info small {
      color: var(--mut);
      font-size: 12px;
    }

    .sheet-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Card de Leitura Instantânea de Código no Pedido/Orçamento */
    .code-lookup-box {
      background: #f8f9fb;
      border: 1.5px solid #d5d9e2;
      border-radius: 6px;
      padding: 14px;
      margin: 10px 0 14px;
    }

    .code-preview-status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 5px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .code-preview-ok {
      background: var(--ok-bg);
      border: 1px solid rgba(46, 158, 73, 0.35);
      color: #1b5e2b;
    }

    .code-preview-inactive {
      background: var(--bad-bg);
      border: 1px solid rgba(217, 30, 54, 0.4);
      color: #8f1122;
    }

    .code-preview-empty {
      background: #eef0f4;
      color: #5a6069;
    }

    #modal-container {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 26, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow: auto;
      padding: 36px 14px;
      z-index: 100;
    }

    #modal-container > div {
      background: var(--card);
      border-top: 4px solid var(--pri);
      border-radius: 6px;
      padding: 24px 26px;
      width: min(760px, 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    #modal-container h3 {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--pri);
      margin: 0 0 14px;
      border-bottom: 1px solid var(--bd);
      padding-bottom: 10px;
    }

    #toast-notification {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dark-bar);
      border-left: 4px solid var(--pri);
      color: #fff;
      padding: 12px 20px;
      border-radius: 4px;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      display: none;
      max-width: 90%;
      z-index: 200;
    }

    .login-bg {
      min-height: 100vh;
      background: linear-gradient(135deg, #18191c 0%, #2b1115 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 6px;
      border-top: 5px solid var(--pri);
      padding: 32px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; }
      .top-pills { display: none; }
      nav {
        flex-direction: row;
        overflow-x: auto;
        padding: 6px 10px;
      }
      .nav-list { flex-direction: row; gap: 4px; }
      nav a { white-space: nowrap; padding: 8px 12px; border-radius: 6px !important; margin: 0; }
      nav a span.arr, .nav-footer { display: none; }
      .action-panel { grid-template-columns: 1fr; }
      .tool-grid { display: none; }
      .add-big-btn { width: 100%; flex-direction: row; gap: 8px; padding: 12px; }
      main { padding: 18px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-container"></div>
  <div id="toast-notification"></div>
  <!-- Input oculto para importação de planilha Excel/CSV -->
  <input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleExcelUpload(event)">

  <script>
    const getEl = id => document.getElementById(id);
    const getVal = id => getEl(id) ? getEl(id).value : '';
    const formatCurrency = num => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(num || 0);
    const formatDate = date => new Date(date).toLocaleDateString('pt-BR');
    const escapeHtml = str => String(str ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

    const sha256 = async str => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    };

    let database;
    let currentUser = null;
    let activePage = 'home';
    let searchQuery = '';
    let prodStatusFilter = 'ALL'; // 'ALL' | 'SIM' | 'NAO'
    let draftOrder = null;
    let lookedUpProduct = null;

    // Amostra fiel extraída da planilha Produtos.xlsx (Cabos Cabel Auto)

    const isCpfValid = cpfStr => {
      if (cpfStr.length !== 11 || /^(\d)\1+$/.test(cpfStr)) return false;
      for (let t = 9; t < 11; t++) {
        let sum = 0;
        for (let c = 0; c < t; c++) sum += Number(cpfStr[c]) * (t + 1 - c);
        if (Number(cpfStr[t]) !== ((sum * 10) % 11) % 10) return false;
      }
      return true;
    };

    const isCnpjValid = cnpjStr => {
      if (cnpjStr.length !== 14 || /^(\d)\1+$/.test(cnpjStr)) return false;
      for (let t = 12; t < 14; t++) {
        let sum = 0, p = t - 7;
        for (let i = 0; i < t; i++) {
          sum += Number(cnpjStr[i]) * p--;
          if (p < 2) p = 9;
        }
        const rest = sum % 11;
        if (Number(cnpjStr[t]) !== (rest < 2 ? 0 : 11 - rest)) return false;
      }
      return true;
    };

    function parseNumberPtBr(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (val == null || val === '') return 0;
      let str = String(val).trim().replace(/[R$\s]/g, '');
      // Se tiver vírgula e ponto (ex: 1.234,56), remove pontos de milhar e troca vírgula por ponto
      if (str.includes(',') && str.includes('.')) {
        str = str.replace(/\./g, '').replace(',', '.');
      } else if (str.includes(',')) {
        str = str.replace(',', '.');
      }
      const num = parseFloat(str);
      return isNaN(num) ? 0 : num;
    }

    function parseAtivoSimNao(val) {
      if (val === undefined || val === null || val === '') return 1;
      const clean = String(val).trim().toLowerCase();
      if (['não', 'nao', 'n', '0', 'false', 'inativo', 'bloqueado'].includes(clean)) {
        return 0;
      }
      return 1; // 'sim', 's', '1', 'true', 'ativo'
    }

    function normalizeUnit(val) {
      if (!val) return 'UN';
      const u = String(val).trim().toUpperCase();
      if (u.startsWith('UN')) return 'UN';
      if (u.startsWith('MET') || u === 'MT' || u === 'M') return 'MT';
      if (u.startsWith('ROL') || u === 'RL') return 'RL';
      return u.slice(0, 4);
    }

    function handleExcelUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

          if (!rows.length) {
            return showToast('A planilha selecionada está vazia.');
          }

          let added = 0;
          let updated = 0;
          let activeCount = 0;
          let inactiveCount = 0;

          rows.forEach(row => {
            // Busca flexível pelas colunas do modelo Produtos.xlsx
            const getCol = (...keys) => {
              for (const k of keys) {
                if (row[k] !== undefined && row[k] !== '') return row[k];
                const foundKey = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
                if (foundKey && row[foundKey] !== '') return row[foundKey];
              }
              return '';
            };

            const rawSku = String(getCol('Código de Barras', 'Codigo de Barras', 'Código', 'SKU', 'Código Interno')).trim().toUpperCase();
            const rawCodInt = String(getCol('Código Interno', 'Codigo Interno')).trim();
            const rawNome = String(getCol('Descrição', 'Descricao', 'Nome', 'Produto')).trim();

            if (!rawSku || !rawNome) return;

            const rawAtivo = getCol('Ativo', 'Status');
            const ativoFlag = parseAtivoSimNao(rawAtivo);
            if (ativoFlag === 1) activeCount++; else inactiveCount++;

            const custo = parseNumberPtBr(getCol('Preço de Custo', 'Preco de Custo', 'Custo'));
            let preco = parseNumberPtBr(getCol('Preço Venda Varejo', 'Preco Venda Varejo', 'Preço de Venda', 'Preco'));
            const precoPor = parseNumberPtBr(getCol('Preço Por', 'Preco Por', 'Preço De'));
            if (!(preco > 0) && precoPor > 0) {
              preco = precoPor;
            }

            const un = normalizeUnit(getCol('Unidade', 'UN'));
            const estRaw = getCol('Quantidade em Estoque', 'Estoque', 'Qtd');
            const est = estRaw === '' ? 100 : parseNumberPtBr(estRaw);
            const cat = String(getCol('Categoria do Produto', 'Categoria')).trim() || 'GERAL';
            const marca = String(getCol('Marca', 'Fabricante')).trim() || 'CABEL AUTO';

            const existing = database.prod.find(p => p.sku.toUpperCase() === rawSku);
            if (existing) {
              existing.codInt = rawCodInt || existing.codInt || '';
              existing.nome = rawNome;
              existing.un = un;
              existing.custo = custo;
              existing.preco = preco > 0 ? preco : existing.preco;
              existing.est = est;
              existing.cat = cat;
              existing.marca = marca;
              existing.ativo = ativoFlag;
              updated++;
            } else {
              database.prod.push({
                id: nextId(),
                codInt: rawCodInt,
                sku: rawSku,
                nome: rawNome,
                un,
                custo,
                preco,
                est,
                cat,
                marca,
                ativo: ativoFlag
              });
              added++;
            }
          });

          addAuditLog(`Planilha ${file.name} importada: ${added} novos, ${updated} atualizados (${activeCount} Ativos / ${inactiveCount} Inativos)`);
          await saveData();
          refreshView();
          showToast(`Planilha importada! ${added} novos, ${updated} atualizados (${activeCount} Sim / ${inactiveCount} Não).`);
        } catch (err) {
          console.error(err);
          showToast('Erro ao ler o arquivo Excel. Verifique se é um arquivo .xlsx ou .csv válido.');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function loadSampleCabelSpreadsheet() {
      let added = 0;
      let updated = 0;
      SAMPLE_CABEL_PRODUCTS.forEach(item => {
        const existing = database.prod.find(p => p.sku.toUpperCase() === item.sku.toUpperCase());
        if (existing) {
          Object.assign(existing, item);
          updated++;
        } else {
          database.prod.push({ id: nextId(), ...item });
          added++;
        }
      });
      addAuditLog(`Base modelo Produtos.xlsx carregada (${added} novos, ${updated} atualizados)`);
      await saveData();
      refreshView();
      showToast(`Produtos da planilha carregados! Teste o código VM250100 no Orçamento/Pedido.`);
    }

    function saveClient() {
      const isCompany = getVal('cli_type') === 'J';
      const cleanDoc = getVal('cli_doc').replace(/\D/g, '');
      const clientName = getVal('cli_name').trim();
      const assignedSeller = isManager() ? getVal('cli_seller') : currentUser.id;

      if (!clientName) return showToast('Informe o nome ou a razão social');
      if (!(isCompany ? isCnpjValid(cleanDoc) : isCpfValid(cleanDoc))) return showToast((isCompany ? 'CNPJ' : 'CPF') + ' inválido');
      if (database.cli.some(c => c.doc.replace(/\D/g, '') === cleanDoc)) return showToast('Já existe cliente com este documento');
      if (!assignedSeller) return showToast('Cadastre um vendedor antes de criar clientes');

      database.cli.push({
        id: nextId(),
        tipo: getVal('cli_type'),
        nome: clientName,
        doc: getVal('cli_doc'),
        email: getVal('cli_email'),
        tel: getVal('cli_phone'),
        cep: getVal('cli_zip'),
        log: getVal('cli_address'),
        cid: getVal('cli_city'),
        uf: getVal('cli_state').toUpperCase(),
        vend: assignedSeller,
        ativo: 1
      });

      addAuditLog(`Cliente ${clientName} criado`);
      saveData();
      closeModal();
      refreshView();
    }

    function saveProduct(editId = '') {
      if (!isManager()) return;
      const sku = getVal('prod_sku').trim().toUpperCase();
      const codInt = getVal('prod_codint').trim();
      const name = getVal('prod_name').trim();
      const ativoStr = getVal('prod_ativo');
      const ativoFlag = parseAtivoSimNao(ativoStr);
      const salePrice = Number(getVal('prod_price'));
      const costPrice = Number(getVal('prod_cost')) || 0;
      const stockInput = getVal('prod_stock');
      const cat = getVal('prod_cat').trim() || 'GERAL';
      const marca = getVal('prod_marca').trim() || 'CABEL AUTO';

      if (!sku || !name || !(salePrice > 0)) {
        return showToast('Informe o Código (ex: VM250100), a Descrição do Cabo e o Preço de Venda.');
      }

      const duplicate = database.prod.find(p => p.sku.toUpperCase() === sku && p.id !== editId);
      if (duplicate) {
        return showToast(`O código ${sku} já está cadastrado para "${duplicate.nome}".`);
      }

      if (editId) {
        const target = database.prod.find(p => p.id === editId);
        if (!target) return;
        target.sku = sku;
        target.codInt = codInt;
        target.nome = name;
        target.ativo = ativoFlag;
        target.un = getVal('prod_unit');
        target.custo = costPrice;
        target.preco = salePrice;
        target.est = stockInput === '' ? null : Number(stockInput);
        target.cat = cat;
        target.marca = marca;
        addAuditLog(`Produto ${sku} (${name}) atualizado — Ativo: ${ativoFlag ? 'Sim' : 'Não'}`);
      } else {
        database.prod.push({
          id: nextId(),
          codInt,
          sku,
          nome: name,
          ativo: ativoFlag,
          un: getVal('prod_unit'),
          custo: costPrice,
          preco: salePrice,
          est: stockInput === '' ? null : Number(stockInput),
          cat,
          marca
        });
        addAuditLog(`Produto ${sku} (${name}) criado — Ativo: ${ativoFlag ? 'Sim' : 'Não'}`);
      }

      saveData();
      closeModal();
      refreshView();
      showToast(`Produto ${sku} salvo com sucesso!`);
    }

    function toggleProductActive(prodId) {
      if (!isManager()) return;
      const product = database.prod.find(p => p.id === prodId);
      if (!product) return;
      product.ativo = isProductActive(product) ? 0 : 1;
      addAuditLog(`Status do produto ${product.sku} alterado para Ativo: ${product.ativo ? 'Sim' : 'Não'}`);
      saveData();
      refreshView();
      showToast(`Produto ${product.sku} marcado como Ativo: ${product.ativo ? 'Sim' : 'Não'}`);
    }

    // =========================================================================
    // ORÇAMENTOS E PEDIDOS COM LEITURA POR CÓDIGO (Ex: VM250100) E VALIDAÇÃO ATIVO SIM/NÃO
    // =========================================================================
    function openQuoteForm() {
      draftOrder = { itens: [], cli: '', frete: 0, parc: 1, codeInput: '' };
      lookedUpProduct = null;
      renderQuoteModal();
    }

    function syncDraftValues() {
      if (getEl('quote_cli')) draftOrder.cli = getVal('quote_cli');
      if (getEl('quote_freight')) draftOrder.frete = Number(getVal('quote_freight')) || 0;
      if (getEl('quote_installments')) draftOrder.parc = Number(getVal('quote_installments')) || 1;
      if (getEl('quote_code_input')) draftOrder.codeInput = getVal('quote_code_input');
    }

    function onCodeInputLookup(rawCode) {
      draftOrder.codeInput = rawCode;
      const cleanCode = String(rawCode || '').trim().toUpperCase();
      const statusEl = getEl('code_lookup_status');
      const selectEl = getEl('quote_item');

      if (!cleanCode) {
        lookedUpProduct = null;
        if (statusEl) {
          statusEl.className = 'code-preview-status code-preview-empty';
          statusEl.innerHTML = `<span>Digite um código da planilha (ex: <b>VM250100</b>, <b>BR100100</b> ou <b>GUARD600VAM1</b>) para buscar a descrição do cabo e verificar se está Ativo (Sim/Não).</span>`;
        }
        return;
      }

      // Procura por correspondência exata de SKU ou Código Interno, ou parcial se único
      let match = database.prod.find(p => p.sku.toUpperCase() === cleanCode || (p.codInt && String(p.codInt).toUpperCase() === cleanCode));
      if (!match) {
        const partials = database.prod.filter(p => p.sku.toUpperCase().startsWith(cleanCode));
        if (partials.length === 1) match = partials[0];
      }

      lookedUpProduct = match || null;

      if (!match) {
        if (statusEl) {
          statusEl.className = 'code-preview-status code-preview-empty';
          statusEl.innerHTML = `<span>Nenhum produto encontrado com o código <b>${escapeHtml(cleanCode)}</b>.</span>`;
        }
        return;
      }

      const active = isProductActive(match);
      if (selectEl && active) {
        selectEl.value = match.id;
      }

      if (statusEl) {
        if (active) {
          statusEl.className = 'code-preview-status code-preview-ok';
          statusEl.innerHTML = `
            <div>
              <span class="badge-sim">ATIVO: SIM</span>
              <b style="margin-left:6px">${escapeHtml(match.sku)} — ${escapeHtml(match.nome)}</b>
              <div style="font-size:12px;margin-top:3px">Unidade: <b>${escapeHtml(match.un)}</b> · Estoque: <b>${match.est ?? '—'}</b> · Preço Unitário: <b>${formatCurrency(match.preco)}</b></div>
            </div>
            <button type="button" onclick="addQuoteItemByLookup()">+ Incluir ${escapeHtml(match.sku)}</button>
          `;
        } else {
          statusEl.className = 'code-preview-status code-preview-inactive';
          statusEl.innerHTML = `
            <div>
              <span class="badge-nao">ATIVO: NÃO (BLOQUEADO)</span>
              <b style="margin-left:6px">${escapeHtml(match.sku)} — ${escapeHtml(match.nome)}</b>
              <div style="font-size:12px;margin-top:3px">Este cabo consta como <b>Ativo = Não</b> na planilha e não pode ser incluído no pedido/orçamento.</div>
            </div>
          `;
        }
      }
    }

    function addQuoteItemByLookup() {
      if (!lookedUpProduct) {
        return showToast('Digite um código válido (ex: VM250100) primeiro.');
      }
      if (!isProductActive(lookedUpProduct)) {
        return showToast(`O produto ${lookedUpProduct.sku} (${lookedUpProduct.nome}) está INATIVO (Ativo: Não) e não pode ser incluído!`);
      }
      syncDraftValues();
      const quantity = Number(getVal('quote_qty')) || 1;
      const discount = Number(getVal('quote_discount')) || 0;

      if (!(quantity > 0) || discount < 0 || discount > 100) {
        return showToast('Informe quantidade maior que zero e desconto entre 0 e 100%');
      }
      if (currentUser.role === 'vendedor' && discount > database.cfg.maxDesc) {
        return showToast(`Desconto acima de ${database.cfg.maxDesc}% exige aprovação do administrador`);
      }

      draftOrder.itens.push({ p: lookedUpProduct.id, q: quantity, pu: lookedUpProduct.preco, d: discount });
      draftOrder.codeInput = '';
      lookedUpProduct = null;
      renderQuoteModal();
      showToast('Cabo adicionado ao orçamento!');
    }

    function renderQuoteModal() {
      const availableClients = filterByOwnership(database.cli).filter(c => c.ativo);
      openModal(`
        <h3>Novo Orçamento / Pedido de Venda</h3>
        <div class="form-layout">
          <label>Cliente</label>
          <select id="quote_cli">
            ${availableClients.length
              ? availableClients.map(c => `<option value="${c.id}" ${c.id === draftOrder.cli ? 'selected' : ''}>${escapeHtml(c.nome)}</option>`).join('')
              : `<option value="">— Cadastre um cliente no menu Clientes primeiro —</option>`}
          </select>

          <!-- Bloco de Busca Rápida pelo Código da Planilha (Ex: VM250100) -->
          <div class="code-lookup-box">
            <label style="margin-top:0;color:var(--pri)">1. Digitar Código para Pedido/Orçamento (Modelo Planilha — ex: VM250100)</label>
            <div style="display:grid;grid-template-columns:1.4fr 1.6fr;gap:10px;align-items:end">
              <div>
                <input id="quote_code_input" list="sku_datalist" placeholder="Ex: VM250100 e aperte Enter" value="${escapeHtml(draftOrder.codeInput || '')}" oninput="onCodeInputLookup(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();addQuoteItemByLookup();}" style="font-weight:700;text-transform:uppercase">
                <datalist id="sku_datalist">
                  ${database.prod.map(p => `<option value="${escapeHtml(p.sku)}">${escapeHtml(p.nome)} (${isProductActive(p) ? 'Ativo: Sim' : 'Ativo: Não'}) — ${formatCurrency(p.preco)}</option>`).join('')}
                </datalist>
              </div>
              <div>
                <select id="quote_item" onchange="const pr=database.prod.find(x=>x.id===this.value);if(pr){getEl('quote_code_input').value=pr.sku;onCodeInputLookup(pr.sku);}">
                  <option value="">— Ou selecione o cabo pela descrição —</option>
                  ${database.prod.map(p => {
                    const act = isProductActive(p);
                    return `<option value="${p.id}" ${!act ? 'disabled' : ''}>[${escapeHtml(p.sku)}] ${escapeHtml(p.nome)} — ${formatCurrency(p.preco)} ${act ? '(Ativo: Sim)' : '(INATIVO: NÃO)'}</option>`;
                  }).join('')}
                </select>
              </div>
            </div>

            <div id="code_lookup_status" class="code-preview-status code-preview-empty">
              <span>Digite um código da planilha (ex: <b>VM250100</b>, <b>BR100100</b> ou <b>GUARD600VAM1</b>) para ler a descrição do cabo e verificar se está Ativo (Sim/Não).</span>
            </div>

            <div style="display:flex;gap:8px;align-items:end;margin-top:10px">
              <div><label style="margin:0">Qtd</label><input id="quote_qty" type="number" value="1" min="1" style="width:90px"></div>
              <div><label style="margin:0">Desc. %</label><input id="quote_discount" type="number" value="0" min="0" style="width:90px"></div>
              <button type="button" onclick="addQuoteItem()">+ Adicionar Item ao Pedido</button>
            </div>
          </div>

          ${renderTable(['Código', 'Descrição do Cabo / Produto', 'Qtd', 'Preço Unit.', 'Desc.', 'Subtotal', ''], draftOrder.itens.map((i, idx) => {
            const pr = database.prod.find(x => x.id === i.p);
            return [
              `<span class="sku-pill">${escapeHtml(pr?.sku || '—')}</span>`,
              `<b>${escapeHtml(pr?.nome || '—')}</b>`,
              i.q,
              formatCurrency(i.pu),
              `${i.d}%`,
              `<b>${formatCurrency(i.q * i.pu * (1 - i.d / 100))}</b>`,
              `<button class="secondary" style="padding:4px 8px;font-size:11px" onclick="draftOrder.itens.splice(${idx},1);renderQuoteModal()">✕</button>`
            ];
          }), true)}

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label>Frete e despesas (R$)</label><input id="quote_freight" type="number" step="0.01" value="${draftOrder.frete}" oninput="syncDraftValues();getEl('quote_total_display').textContent=formatCurrency(calculateOrderTotal(draftOrder))"></div>
            <div><label>Parcelas</label><select id="quote_installments">${[1, 2, 3, 4, 5, 6].map(n => `<option value="${n}" ${n === draftOrder.parc ? 'selected' : ''}>${n}x</option>`).join('')}</select></div>
          </div>
          <p style="font-size:17px">Total: <b id="quote_total_display" style="font-family:var(--font-serif);color:var(--pri);font-size:22px">${formatCurrency(calculateOrderTotal(draftOrder))}</b></p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button onclick="saveQuote(false)">Salvar Orçamento</button>
            <button class="dark-btn" onclick="saveQuote(true)">⚡ Salvar e Já Converter em Pedido</button>
            <button class="secondary" onclick="closeModal()">Cancelar</button>
          </div>
        </div>`);

      if (draftOrder.codeInput) {
        onCodeInputLookup(draftOrder.codeInput);
      }
    }

    function addQuoteItem() {
      syncDraftValues();
      // Se o usuário digitou um código no campo de código, prioriza o produto localizado pelo código
      let product = lookedUpProduct || database.prod.find(x => x.id === getVal('quote_item'));
      const quantity = Number(getVal('quote_qty'));
      const discount = Number(getVal('quote_discount'));

      if (!product) {
        return showToast('Digite um código válido (ex: VM250100) ou selecione um produto na lista.');
      }
      if (!isProductActive(product)) {
        return showToast(`Bloqueado: O produto ${product.sku} (${product.nome}) está com Ativo = Não!`);
      }
      if (!(quantity > 0) || discount < 0 || discount > 100) {
        return showToast('Informe quantidade maior que zero e desconto entre 0 e 100%');
      }
      if (currentUser.role === 'vendedor' && discount > database.cfg.maxDesc) {
        return showToast(`Desconto acima de ${database.cfg.maxDesc}% exige aprovação do administrador`);
      }

      draftOrder.itens.push({ p: product.id, q: quantity, pu: product.preco, d: discount });
      draftOrder.codeInput = '';
      lookedUpProduct = null;
      renderQuoteModal();
    }

    function saveQuote(directOrder = false) {
      syncDraftValues();
      const client = database.cli.find(x => x.id === draftOrder.cli);
      if (!client || !draftOrder.itens.length) return showToast('Escolha o cliente e adicione ao menos um cabo/produto.');

      const quote = {
        id: nextId(),
        n: nextSeqNumber('o'),
        cli: client.id,
        vend: currentUser.role === 'vendedor' ? currentUser.id : client.vend,
        data: Date.now(),
        itens: draftOrder.itens,
        frete: draftOrder.frete,
        parc: draftOrder.parc,
        st: directOrder ? 'Aprovado pelo cliente' : 'Rascunho',
        ped: null,
        hist: [[Date.now(), currentUser.nome, 'Criado']]
      };

      database.orc.push(quote);
      addAuditLog(`Orçamento ${quote.n} criado`);

      if (directOrder) {
        convertToOrder(quote.id);
        closeModal();
        return;
      }

      saveData();
      closeModal();
      refreshView();
    }

    function updateQuoteStatus(id, newStatus) {
      const quote = database.orc.find(x => x.id === id);
      if (!quote || quote.ped || (!isManager() && quote.vend !== currentUser.id)) return;
      quote.st = newStatus;
      quote.hist.push([Date.now(), currentUser.nome, `Status: ${newStatus}`]);
      addAuditLog(`Orçamento ${quote.n}: ${newStatus}`);
      saveData();
      refreshView();
    }

    function convertToOrder(quoteId) {
      const quote = database.orc.find(x => x.id === quoteId);
      if (!quote || quote.ped || quote.st !== 'Aprovado pelo cliente' || (!isManager() && quote.vend !== currentUser.id)) return;

      const order = {
        id: nextId(),
        n: nextSeqNumber('p'),
        orc: quote.id,
        cli: quote.cli,
        vend: quote.vend,
        data: Date.now(),
        itens: quote.itens.map(i => ({ ...i, fat: 0 })),
        frete: quote.frete,
        parc: quote.parc,
        st: 'Aprovado',
        hist: [[Date.now(), currentUser.nome, `Criado a partir do orçamento ${quote.n}`]]
      };

      database.ped.push(order);
      quote.ped = order.id;
      quote.st = 'Convertido em pedido';
      quote.hist.push([Date.now(), currentUser.nome, `Convertido no pedido ${order.n}`]);

      addAuditLog(`Orçamento ${quote.n} convertido no pedido ${order.n}`);
      saveData();
      refreshView();
      showToast(`Pedido ${order.n} gerado!`);
    }

    function openOrderDetails(orderId) {
      const order = database.ped.find(x => x.id === orderId);
      if (!order) return;
      const canInvoice = isManager() && order.st !== 'Faturado';

      openModal(`
        <h3>Pedido #${order.n} — ${escapeHtml(order.st)}</h3>
        <p class="mut">${getEntityName('cli', order.cli)} · Vendedor: ${getEntityName('users', order.vend)} · Frete: ${formatCurrency(order.frete)} · ${order.parc}x</p>
        ${renderTable(['Código / Descrição do Cabo', 'Qtd', 'Faturado', 'Saldo', 'Faturar agora'], order.itens.map((item, index) => {
          const balance = item.q - item.fat;
          return [
            getProductDisplay(item.p),
            item.q,
            item.fat,
            balance,
            canInvoice && balance > 0 ? `<input id="invoice_qty_${index}" type="number" min="0" max="${balance}" value="${balance}" style="width:80px">` : '—'
          ];
        }), true)}
        <p style="font-size:17px">Total: <b style="font-family:var(--font-serif);color:var(--pri);font-size:22px">${formatCurrency(calculateOrderTotal(order))}</b></p>
        <p class="mut" style="font-size:12px">Histórico: ${order.hist.map(h => `${formatDate(h[0])} ${escapeHtml(h[2])}`).join(' · ')}</p>
        ${canInvoice ? `<button onclick="processInvoice('${order.id}')">Faturar Agora</button> ` : ''}
        <button class="secondary" onclick="closeModal()">Fechar</button>`);
    }

    function processInvoice(orderId) {
      const order = database.ped.find(x => x.id === orderId);
      if (!isManager() || !order || !['Aprovado', 'Parcialmente faturado'].includes(order.st)) return;

      const quantities = order.itens.map((item, index) => {
        const input = getEl(`invoice_qty_${index}`);
        return input ? Number(input.value) || 0 : 0;
      });

      const hasInvalidQuantities = quantities.some((qty, i) => qty < 0 || qty > (order.itens[i].q - order.itens[i].fat));
      if (hasInvalidQuantities || !quantities.some(q => q > 0)) {
        return showToast('Informe quantidades maiores que zero e dentro do saldo do pedido');
      }

      let netAmount = 0;
      order.itens.forEach((item, index) => {
        const invoiceQty = quantities[index];
        item.fat += invoiceQty;
        netAmount += invoiceQty * item.pu * (1 - item.d / 100);

        const catalogItem = database.prod.find(x => x.id === item.p);
        if (catalogItem && catalogItem.est != null) {
          catalogItem.est -= invoiceQty;
        }
      });
      netAmount = Math.round(netAmount * 100) / 100;

      const isFirstInvoice = !database.fat.some(x => x.ped === order.id);
      const freightCost = isFirstInvoice ? Number(order.frete || 0) : 0;
      const invoiceTotal = Math.round((netAmount + freightCost) * 100) / 100;

      const invoice = {
        id: nextId(),
        n: nextSeqNumber('f'),
        ped: order.id,
        cli: order.cli,
        vend: order.vend,
        data: Date.now(),
        liq: netAmount,
        total: invoiceTotal
      };
      database.fat.push(invoice);

      order.st = order.itens.every(i => i.fat >= i.q) ? 'Faturado' : 'Parcialmente faturado';
      order.hist.push([Date.now(), currentUser.nome, `Faturamento ${invoice.n}`]);

      const installmentsCount = order.parc || 1;
      const baseInstallmentValue = Math.round((invoice.total / installmentsCount) * 100) / 100;
      let installmentSum = 0;

      for (let k = 1; k <= installmentsCount; k++) {
        const value = k < installmentsCount ? baseInstallmentValue : Math.round((invoice.total - installmentSum) * 100) / 100;
        installmentSum += value;
        database.rec.push({
          id: nextId(),
          fat: invoice.id,
          n: invoice.n,
          cli: order.cli,
          vend: order.vend,
          parc: `${k}/${installmentsCount}`,
          venc: Date.now() + 2592000000 * k,
          valor: value,
          pago: 0
        });
      }

      const seller = database.users.find(x => x.id === order.vend);
      const commissionRate = seller ? seller.pct : 0;

      if (!database.com.some(c => c.fat === invoice.id)) {
        database.com.push({
          id: nextId(),
          fat: invoice.id,
          n: invoice.n,
          ped: order.n,
          cli: order.cli,
          vend: order.vend,
          base: netAmount,
          pct: commissionRate,
          valor: Math.round(netAmount * commissionRate) / 100,
          st: 'Apurada'
        });
      }

      evaluateCommissions();
      addAuditLog(`Faturamento ${invoice.n} do pedido ${order.n}`);
      saveData();
      closeModal();
      refreshView();
      showToast(`Faturamento ${invoice.n} registrado!`);
    }

    function evaluateCommissions() {
      database.com.forEach(entry => {
        if (entry.st !== 'Apurada') return;
        const relatedReceipts = database.rec.filter(x => x.fat === entry.fat);
        const isFullyPaid = relatedReceipts.every(x => (x.valor - x.pago) < 0.005);

        if (!database.cfg.liberaApos || isFullyPaid) {
          entry.st = 'Liberada';
        }
      });
    }

    function settleReceipt(receiptId) {
      if (!isManager()) return;
      const receipt = database.rec.find(x => x.id === receiptId);
      const paymentAmount = Math.round(Number(getVal(`receipt_${receiptId}`)) * 100) / 100;

      if (!receipt || !(paymentAmount > 0) || paymentAmount > (receipt.valor - receipt.pago + 0.005)) {
        return showToast('Informe um valor maior que zero e até o saldo da parcela');
      }

      receipt.pago = Math.round((receipt.pago + paymentAmount) * 100) / 100;
      evaluateCommissions();
      addAuditLog(`Recebimento de ${formatCurrency(paymentAmount)} na fatura ${receipt.n}`);
      saveData();
      refreshView();
      showToast('Recebimento registrado!');
    }

    function payCommission(commissionId) {
      if (!isAdmin()) return;
      const commission = database.com.find(x => x.id === commissionId);
      if (!commission || commission.st !== 'Liberada') return;

      commission.st = 'Paga';
      addAuditLog(`Comissão da fatura ${commission.n} marcada como paga`);
      saveData();
      refreshView();
    }

    function openUserForm() {
      openModal(`
        <h3>Novo Vendedor ou Usuário</h3>
        <div class="form-layout">
          <label>Nome</label><input id="usr_name">
          <label>E-mail</label><input id="usr_email" type="email">
          <label>Senha provisória (mínimo 6 caracteres)</label><input id="usr_pass" type="password">
          <label>Perfil</label>
          <select id="usr_role">
            <option value="vendedor">Vendedor</option>
            <option value="gerente">Gerente comercial</option>
            <option value="admin">Administrador</option>
          </select>
          <label>Comissão %</label>
          <input id="usr_pct" type="number" step="0.1" value="5">
          <br><br>
          <button onclick="saveUser()">Salvar Usuário</button>
          <button class="secondary" onclick="closeModal()">Cancelar</button>
        </div>`);
    }

    async function saveUser() {
      if (!isAdmin()) return;
      const email = getVal('usr_email').trim().toLowerCase();
      const commissionRate = Number(getVal('usr_pct'));
      const name = getVal('usr_name').trim();
      const password = getVal('usr_pass');
      const role = getVal('usr_role');

      if (!name || !email.includes('@') || password.length < 6) {
        return showToast('Informe nome, e-mail válido e senha com 6 ou mais caracteres');
      }
      if (!(commissionRate >= 0 && commissionRate <= 100)) {
        return showToast('Percentual de comissão inválido');
      }
      if (database.users.some(u => u.email === email)) {
        return showToast('Este e-mail já está cadastrado');
      }

      database.users.push({
        id: nextId(),
        nome: name,
        email,
        h: await sha256(password),
        role,
        pct: commissionRate,
        ativo: 1
      });

      addAuditLog(`Usuário ${email} criado`);
      await saveData();
      closeModal();
      refreshView();
    }

    function updateUserCommission(userId, newPercentage) {
      if (!isAdmin()) return;
      const user = database.users.find(y => y.id === userId);
      const parsedPercentage = Number(newPercentage);

      if (!user || !(parsedPercentage >= 0 && parsedPercentage <= 100)) {
        return showToast('Percentual inválido');
      }

      user.pct = parsedPercentage;
      addAuditLog(`Comissão de ${user.nome} alterada para ${parsedPercentage}%`);
      saveData();
      showToast('Percentual atualizado.');
    }

    function toggleUserStatus(userId) {
      if (!isAdmin() || userId === currentUser.id) return;
      const user = database.users.find(x => x.id === userId);
      user.ativo = user.ativo ? 0 : 1;

      addAuditLog(`${user.ativo ? 'Ativou' : 'Desativou'} ${user.email}`);
      saveData();
      refreshView();
    }

    // Inicialização: busca os dados do servidor no Render (/api/db)
    (async () => {
      try {
        const res = await fetch('/api/db');
        if (res.ok) {
          database = await res.json();
        }
      } catch (e) {
        try {
          const local = localStorage.getItem('marketlandia_db');
          if (local) database = JSON.parse(local);
        } catch (err) {}
      }

      if (!database || !Array.isArray(database.users)) {
        database = {
          seq: { o: 100, p: 2180, f: 500 },
          users: [],
          cli: [],
          prod: [],
          orc: [],
          ped: [],
          fat: [],
          com: [],
          rec: [],
          audit: [],
          cfg: { liberaApos: 1, maxDesc: 10 }
        };
      }

      // Se o catálogo ainda estiver vazio, pré-carrega os cabos da planilha para uso imediato
      if (Array.isArray(database.prod) && database.prod.length === 0) {
        SAMPLE_CABEL_PRODUCTS.forEach(item => {
          database.prod.push({ id: nextId(), ...item });
        });
        await saveData();
      }

      renderApp();
    })();
  </script>
</body>
