    }

    function addQuoteItem() {
      syncDraftValues();
      let product = lookedUpProduct || database.prod.find(x => x.id === getVal('quote_item'));
      const quantity = Number(getVal('quote_qty'));
      const discount = Number(getVal('quote_discount'));

      if (!product) {
        return showToast('Digite um código válido (ex: VM250100) ou selecione um produto na lista.');
      }
      if (!isProductActive(product)) {
        return showToast(`Bloqueado: O produto ${product.sku} (${product.nome}) está com Ativo = Não!`);
      }
      if (!(quantity > 0) || discount < 0 || discount > 100) {
        return showToast('Informe quantidade maior que zero e desconto entre 0 e 100%');
      }
      if (currentUser.role === 'vendedor' && discount > database.cfg.maxDesc) {
        return showToast(`Desconto acima de ${database.cfg.maxDesc}% exige aprovação do administrador`);
      }

      draftOrder.itens.push({ p: product.id, q: quantity, pu: product.preco, d: discount });
      draftOrder.codeInput = '';
      lookedUpProduct = null;
      renderQuoteModal();
    }

    function saveQuote(directOrder = false, openPrintAfter = false) {
      syncDraftValues();
      const client = database.cli.find(x => x.id === draftOrder.cli);
      if (!client || !draftOrder.itens.length) return showToast('Escolha o cliente e adicione ao menos um cabo/produto.');

      const sellerName = (draftOrder.vendNome || '').trim() || currentUser.nome;

      const quote = {
        id: nextId(),
        n: nextSeqNumber('o'),
        cli: client.id,
        vend: currentUser.role === 'vendedor' ? currentUser.id : (client.vend || currentUser.id),
        vendNome: sellerName,
        data: Date.now(),
        dataEntrega: draftOrder.dataEntrega || todayIso(),
        itens: draftOrder.itens,
        frete: draftOrder.frete,
        outros: draftOrder.outros || 0,
        parc: draftOrder.parc,
        formaPag: draftOrder.formaPag || 'CHEQUE',
        condPag: draftOrder.condPag || '30 Dias',
        obs: draftOrder.obs || '',
        st: directOrder ? 'Aprovado pelo cliente' : 'Rascunho',
        ped: null,
        hist: [[Date.now(), currentUser.nome, 'Criado']]
      };

      database.orc.push(quote);
      addAuditLog(`Orçamento ${quote.n} criado (Vendedor: ${sellerName})`);

      if (directOrder) {
        const newOrder = convertToOrder(quote.id);
        closeModal();
        if (openPrintAfter && newOrder) {
          openPrintPreview('ped', newOrder.id);
        }
        return;
      }

      saveData();
      closeModal();
      refreshView();
      if (openPrintAfter) {
        openPrintPreview('orc', quote.id);
      }
    }

    function updateQuoteStatus(id, newStatus) {
      const quote = database.orc.find(x => x.id === id);
      if (!quote || quote.ped || (!isManager() && quote.vend !== currentUser.id)) return;
      quote.st = newStatus;
      quote.hist.push([Date.now(), currentUser.nome, `Status: ${newStatus}`]);
      addAuditLog(`Orçamento ${quote.n}: ${newStatus}`);
      saveData();
      refreshView();
    }

    function convertToOrder(quoteId) {
      const quote = database.orc.find(x => x.id === quoteId);
      if (!quote || quote.ped || quote.st !== 'Aprovado pelo cliente' || (!isManager() && quote.vend !== currentUser.id)) return null;

      const order = {
        id: nextId(),
        n: nextSeqNumber('p'),
        orc: quote.id,
        cli: quote.cli,
        vend: quote.vend,
        vendNome: quote.vendNome || getEntityName('users', quote.vend),
        data: Date.now(),
        dataEntrega: quote.dataEntrega || todayIso(),
        itens: quote.itens.map(i => ({ ...i, fat: 0 })),
        frete: quote.frete,
        outros: quote.outros || 0,
        parc: quote.parc,
        formaPag: quote.formaPag || 'CHEQUE',
        condPag: quote.condPag || '30 Dias',
        obs: quote.obs || '',
        st: 'Aprovado',
        hist: [[Date.now(), currentUser.nome, `Criado a partir do orçamento ${quote.n}`]]
      };

      database.ped.push(order);
      quote.ped = order.id;
      quote.st = 'Convertido em pedido';
      quote.hist.push([Date.now(), currentUser.nome, `Convertido no pedido ${order.n}`]);

      addAuditLog(`Orçamento ${quote.n} convertido no pedido ${order.n}`);
      saveData();
      refreshView();
      showToast(`Pedido ${order.n} gerado!`);
      return order;
    }

    function openOrderDetails(orderId) {
      const order = database.ped.find(x => x.id === orderId);
      if (!order) return;
      const canInvoice = isManager() && order.st !== 'Faturado';

      openModal(`
        <h3>Pedido #${order.n} — ${escapeHtml(order.st)}</h3>
        <p class="mut">${getEntityName('cli', order.cli)} · Vendedor: <b>${getSellerDisplayName(order)}</b> · Pagamento: <b>${escapeHtml(order.formaPag || 'CHEQUE')} (${order.parc}x)</b></p>
        ${renderTable(['Código / Descrição do Cabo', 'Unid.', 'Qtd / Metros', 'Faturado', 'Saldo', 'Faturar agora'], order.itens.map((item, index) => {
          const balance = item.q - item.fat;
          const pr = database.prod.find(x => x.id === item.p);
          return [
            getProductDisplay(item.p),
            escapeHtml(pr?.un || 'UN'),
            formatNumber(item.q, 3),
            formatNumber(item.fat, 3),
            formatNumber(balance, 3),
            canInvoice && balance > 0 ? `<input id="invoice_qty_${index}" type="number" step="0.001" min="0" max="${balance}" value="${balance}" style="width:90px">` : '—'
          ];
        }), true)}
        <p style="font-size:17px">Total: <b style="font-family:var(--font-serif);color:var(--pri);font-size:22px">${formatCurrency(calculateOrderTotal(order))}</b></p>
        <p class="mut" style="font-size:12px">Histórico: ${order.hist.map(h => `${formatDate(h[0])} ${escapeHtml(h[2])}`).join(' · ')}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button onclick="closeModal();openPrintPreview('ped', '${order.id}')">${icon('printer')} Imprimir Pedido (Modelo Cabolândia)</button>
            ${canInvoice ? `<button class="dark-btn" onclick="processInvoice('${order.id}')">${icon('file')} Faturar Agora</button>` : ''}
            <button class="secondary" onclick="closeModal()">Fechar</button>
          </div>
          <button class="danger-outline" onclick="confirmDeleteOrder('${order.id}')">${icon('trash')} Excluir Pedido</button>
        </div>`);
    }

    // =========================================================================
    // SISTEMA DE IMPRESSÃO DE PEDIDOS / ORÇAMENTOS (MODELO CABOLÂNDIA / MARKETUP)
    // =========================================================================
    function openPrintPreview(type, id, forceTitleMode = null) {
      const collection = type === 'orc' ? database.orc : database.ped;
      const doc = collection.find(x => x.id === id);
      if (!doc) return showToast('Registro não encontrado para impressão.');

      const client = database.cli.find(c => c.id === doc.cli) || {};
      const emp = getCompanyInfo();
      const sellerName = doc.vendNome || (database.users.find(u => u.id === doc.vend)?.nome) || 'Thiago';

      const docLabelTitle = forceTitleMode || (type === 'orc' ? 'ORÇAMENTO DE VENDA' : 'PEDIDO DE VENDA');
      const topDocLabel = docLabelTitle === 'ORÇAMENTO DE VENDA' ? `Orçamento: ${doc.n}` : `Pedido: ${doc.n}`;

      // Cálculos de quantidades e totais
      let totalQty = 0;
      let grossItemsSum = 0;
      let totalDiscountSum = 0;
      let netItemsSum = 0;

      const itemRowsHtml = doc.itens.map(item => {
        const prod = database.prod.find(p => p.id === item.p) || { sku: '—', nome: 'PRODUTO EXCLUÍDO', un: 'UN' };
        const qty = Number(item.q) || 0;
        const unitPrice = Number(item.pu) || 0;
        const discountPct = Number(item.d) || 0;
        const grossLine = qty * unitPrice;
        const discountVal = grossLine * (discountPct / 100);
        const netLine = grossLine - discountVal;

        totalQty += qty;
        grossItemsSum += grossLine;
        totalDiscountSum += discountVal;
        netItemsSum += netLine;

        return `
          <tr>
            <td>${escapeHtml(prod.sku)}</td>
            <td>${escapeHtml(prod.nome)}</td>
            <td style="text-align:center">${escapeHtml(getUnitLabel(prod.un))}</td>
            <td style="text-align:center">${formatNumber(qty, 3)}</td>
            <td style="text-align:right">${formatCurrency(unitPrice)}</td>
            <td style="text-align:right">${formatCurrency(discountVal)}</td>
            <td style="text-align:right">${formatCurrency(netLine)}</td>
          </tr>
        `;
      }).join('');

      const freteVal = Number(doc.frete) || 0;
      const outrosVal = Number(doc.outros) || 0;
      const grandTotal = netItemsSum + freteVal + outrosVal;

      // Monta parcelas de Forma / Condições de Pagamento
      const installmentsCount = Number(doc.parc) || 1;
      const formaPag = (doc.formaPag || 'CHEQUE').toUpperCase();
      const condPag = doc.condPag || `${installmentsCount * 30} Dias`;

      // Verifica se já existem títulos gerados no financeiro para este pedido
      const relatedInvoices = database.fat.filter(f => f.ped === doc.id).map(f => f.id);
      const relatedReceivables = database.rec.filter(r => relatedInvoices.includes(r.fat));

      let paymentRowsHtml = '';
      if (relatedReceivables.length > 0) {
        paymentRowsHtml = relatedReceivables.map((r, idx) => {
          const saldo = Math.max(0, r.valor - r.pago);
          const desc = `${formaPag} (${String(installmentsCount).padStart(2, '0')}x (${condPag})) [${idx + 1} / ${relatedReceivables.length}]`;
          return `
            <tr>
              <td>${escapeHtml(desc)}</td>
              <td>${formatDate(r.venc)}</td>
              <td>${r.pago >= r.valor - 0.005 ? formatDate(Date.now()) : ''}</td>
              <td>${formatNumber(r.valor, 2)}</td>
              <td>${formatNumber(saldo, 2)}</td>
              <td></td>
            </tr>
          `;
        }).join('');
      } else {
        const baseParcel = Math.round((grandTotal / installmentsCount) * 100) / 100;
        let accum = 0;
        const rows = [];
        for (let k = 1; k <= installmentsCount; k++) {
          const val = k < installmentsCount ? baseParcel : Math.round((grandTotal - accum) * 100) / 100;
          accum += val;
          const dueDate = new Date((doc.data || Date.now()) + (k * 30 * 86400000));
          const desc = `${formaPag} (${String(installmentsCount).padStart(2, '0')}x (${condPag})) [${k} / ${installmentsCount}]`;
          rows.push(`
            <tr>
              <td>${escapeHtml(desc)}</td>
              <td>${formatDate(dueDate)}</td>
              <td></td>
              <td>${formatNumber(val, 2)}</td>
              <td>${formatNumber(val, 2)}</td>
              <td></td>
            </tr>
          `);
        }
        paymentRowsHtml = rows.join('');
      }

      const createdDateStr = formatDate(doc.data);
      const deliveryDateStr = formatDate(doc.dataEntrega || doc.data);

      const overlay = getEl('print-overlay');
      overlay.innerHTML = `
        <div class="print-toolbar">
          <div style="display:flex;align-items:center;gap:12px">
            <strong style="font-size:14px">${icon('file')} Visualização de Impressão — ${escapeHtml(topDocLabel)}</strong>
            <span style="font-size:12px;color:#b0b5bd">Vendedor: <b>${escapeHtml(sellerName)}</b></span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="secondary" style="padding:7px 12px;font-size:12px" onclick="openPrintPreview('${type}', '${doc.id}', '${docLabelTitle === 'PEDIDO DE VENDA' ? 'ORÇAMENTO DE VENDA' : 'PEDIDO DE VENDA'}')">${icon('swap')} Alternar Título (${docLabelTitle === 'PEDIDO DE VENDA' ? 'Orçamento' : 'Pedido'})</button>
            <button class="secondary" style="padding:7px 12px;font-size:12px" onclick="openEditPrintMeta('${type}', '${doc.id}')">${icon('edit')} Editar Vendedor / Nº / Pagamento</button>
            <button style="padding:7px 16px;font-size:13px;background:var(--ok)" onclick="window.print()">${icon('printer')} Imprimir Agora / Salvar PDF</button>
            <button class="secondary" style="padding:7px 12px;font-size:12px" onclick="closePrintPreview()">${icon('x')} Fechar</button>
          </div>
        </div>

        <div class="print-sheet">
          <div>
            <div class="mu-top-number">${escapeHtml(topDocLabel)}</div>

            <!-- Cabeçalho da Empresa -->
            <div class="mu-header-grid">
              <div class="mu-logo-box">
                ${emp.logoUrl ? `<img src="${escapeHtml(emp.logoUrl)}" alt="Logo" onerror="this.style.display='none'">` : ''}
              </div>
              <div class="mu-company-info">
                <div>${escapeHtml(emp.razao)}</div>
                <div>${escapeHtml(emp.fantasia)}</div>
                <div>CNPJ: ${escapeHtml(emp.cnpj)}</div>
                <div>${escapeHtml(emp.end)}</div>
                <div>${escapeHtml(emp.cepCidUf)}</div>
                <div>${escapeHtml(emp.tel)}</div>
              </div>
            </div>

            <!-- Seção 1: PEDIDO DE VENDA -->
            <div class="mu-section-bar">${escapeHtml(docLabelTitle)}</div>
            <div class="mu-info-rows">
              <div class="mu-info-line">
                <div class="mu-field"><span class="mu-lbl">Pedido:</span> <span class="mu-val">${escapeHtml(doc.n)}</span></div>
                <div class="mu-field inline" style="margin-left:28px"><span class="mu-lbl">Vendedor:</span> <span class="mu-val">${escapeHtml(sellerName)}</span></div>
              </div>
              <div class="mu-info-line">
                <div class="mu-field"><span class="mu-lbl">Cliente:</span> <span class="mu-val">${escapeHtml((client.nome || 'CLIENTE NÃO INFORMADO').toUpperCase())}</span></div>
              </div>
              <div class="mu-info-line">
                <div class="mu-field"><span class="mu-lbl">CNPJ:</span> <span class="mu-val">${escapeHtml(client.doc || '—')}</span></div>
                <div class="mu-field inline" style="margin-left:70px"><span class="mu-lbl">IE:</span> <span class="mu-val">${escapeHtml(client.ie || '—')}</span></div>
              </div>
              <div class="mu-info-line">
                <div class="mu-field"><span class="mu-lbl">E-Mail:</span> <span class="mu-val">${escapeHtml(client.email || '—')}</span></div>
                <div class="mu-field inline" style="margin-left:45px"><span class="mu-lbl">Telefone:</span> <span class="mu-val">${escapeHtml(client.tel || '—')}</span></div>
              </div>
              <div class="mu-info-line">
                <div class="mu-field"><span class="mu-lbl">Data de criação:</span> <span class="mu-val">${createdDateStr}</span></div>
                <div class="mu-field inline" style="margin-left:32px"><span class="mu-lbl">Data de emissão:</span> <span class="mu-val">${createdDateStr}</span></div>
                <div class="mu-field inline" style="margin-left:32px"><span class="mu-lbl">Data de entrega:</span> <span class="mu-val">${deliveryDateStr}</span></div>
              </div>
            </div>

            <!-- Seção 2: ENDEREÇO DE COBRANÇA -->
            <div class="mu-section-bar">ENDEREÇO DE COBRANÇA</div>
            <div class="mu-info-rows">
              <div class="mu-info-line">
                <div class="mu-field" style="min-width:260px"><span class="mu-lbl">Endereço:</span> <span class="mu-val">${escapeHtml(client.log || '—')}</span></div>
                <div class="mu-field inline"><span class="mu-lbl">Número:</span> <span class="mu-val">${escapeHtml(client.num || 'S/N')}</span></div>
              </div>
              <div class="mu-info-line">
                <div class="mu-field" style="min-width:260px"><span class="mu-lbl">Bairro:</span> <span class="mu-val">${escapeHtml(client.bairro || '—')}</span></div>
                <div class="mu-field inline" style="min-width:140px"><span class="mu-lbl">CEP:</span> <span class="mu-val">${escapeHtml(client.cep || '—')}</span></div>
                <div class="mu-field inline" style="min-width:150px"><span class="mu-lbl">Cidade:</span> <span class="mu-val">${escapeHtml(client.cid || 'Alfenas')}</span></div>
                <div class="mu-field inline"><span class="mu-lbl">Estado:</span> <span class="mu-val">${escapeHtml(client.uf || 'MG')}</span></div>
              </div>
            </div>

            <!-- Seção 3: ENDEREÇO DE ENTREGA -->

    function processInvoice(orderId) {
      const order = database.ped.find(x => x.id === orderId);
      if (!isManager() || !order || !['Aprovado', 'Parcialmente faturado'].includes(order.st)) return;

      const quantities = order.itens.map((item, index) => {
        const input = getEl(`invoice_qty_${index}`);
        return input ? Number(input.value) || 0 : 0;
      });

      const hasInvalidQuantities = quantities.some((qty, i) => qty < 0 || qty > (order.itens[i].q - order.itens[i].fat));
      if (hasInvalidQuantities || !quantities.some(q => q > 0)) {
        return showToast('Informe quantidades maiores que zero e dentro do saldo do pedido');
      }

      let netAmount = 0;
      order.itens.forEach((item, index) => {
        const invoiceQty = quantities[index];
        item.fat += invoiceQty;
        netAmount += invoiceQty * item.pu * (1 - item.d / 100);

        const catalogItem = database.prod.find(x => x.id === item.p);
        if (catalogItem && catalogItem.est != null) {
          catalogItem.est -= invoiceQty;
        }
      });
      netAmount = Math.round(netAmount * 100) / 100;

      const isFirstInvoice = !database.fat.some(x => x.ped === order.id);
      const freightCost = isFirstInvoice ? Number(order.frete || 0) : 0;
      const invoiceTotal = Math.round((netAmount + freightCost) * 100) / 100;

      const invoice = {
        id: nextId(),
        n: nextSeqNumber('f'),
        ped: order.id,
        cli: order.cli,
        vend: order.vend,
        data: Date.now(),
        liq: netAmount,
        total: invoiceTotal
      };
      database.fat.push(invoice);

      order.st = order.itens.every(i => i.fat >= i.q) ? 'Faturado' : 'Parcialmente faturado';
      order.hist.push([Date.now(), currentUser.nome, `Faturamento ${invoice.n}`]);

      const installmentsCount = order.parc || 1;
      const baseInstallmentValue = Math.round((invoice.total / installmentsCount) * 100) / 100;
      let installmentSum = 0;

      for (let k = 1; k <= installmentsCount; k++) {
        const value = k < installmentsCount ? baseInstallmentValue : Math.round((invoice.total - installmentSum) * 100) / 100;
        installmentSum += value;
        database.rec.push({
          id: nextId(),
          fat: invoice.id,
          n: invoice.n,
          cli: order.cli,
          vend: order.vend,
          parc: `${k}/${installmentsCount}`,
          venc: Date.now() + 2592000000 * k,
          valor: value,
          pago: 0
        });
      }

      const seller = database.users.find(x => x.id === order.vend);
      const commissionRate = seller ? seller.pct : 0;

      if (!database.com.some(c => c.fat === invoice.id)) {
        database.com.push({
          id: nextId(),
          fat: invoice.id,
          n: invoice.n,
          ped: order.n,
          cli: order.cli,
          vend: order.vend,
          base: netAmount,
          pct: commissionRate,
          valor: Math.round(netAmount * commissionRate) / 100,
          st: 'Apurada'
        });
      }

      evaluateCommissions();
      addAuditLog(`Faturamento ${invoice.n} do pedido ${order.n}`);
      saveData();
      closeModal();
      refreshView();
      showToast(`Faturamento ${invoice.n} registrado!`);
    }

    function evaluateCommissions() {
      database.com.forEach(entry => {
        if (entry.st !== 'Apurada') return;
        const relatedReceipts = database.rec.filter(x => x.fat === entry.fat);
        const isFullyPaid = relatedReceipts.every(x => (x.valor - x.pago) < 0.005);

        if (!database.cfg.liberaApos || isFullyPaid) {
          entry.st = 'Liberada';
        }
      });
    }

    function settleReceipt(receiptId) {
      if (!isManager()) return;
      const receipt = database.rec.find(x => x.id === receiptId);
      const paymentAmount = Math.round(Number(getVal(`receipt_${receiptId}`)) * 100) / 100;

      if (!receipt || !(paymentAmount > 0) || paymentAmount > (receipt.valor - receipt.pago + 0.005)) {
        return showToast('Informe um valor maior que zero e até o saldo da parcela');
      }

      receipt.pago = Math.round((receipt.pago + paymentAmount) * 100) / 100;
      evaluateCommissions();
      addAuditLog(`Recebimento de ${formatCurrency(paymentAmount)} na fatura ${receipt.n}`);
      saveData();
      refreshView();
      showToast('Recebimento registrado!');
    }

    function payCommission(commissionId) {
      if (!isAdmin()) return;
      const commission = database.com.find(x => x.id === commissionId);
      if (!commission || commission.st !== 'Liberada') return;

      commission.st = 'Paga';
      addAuditLog(`Comissão da fatura ${commission.n} marcada como paga`);
      saveData();
      refreshView();
    }

    async function saveUser() {
      if (!isAdmin()) return;
      const email = getVal('usr_email').trim().toLowerCase();
      const commissionRate = Number(getVal('usr_pct'));
      const name = getVal('usr_name').trim();
      const password = getVal('usr_pass');
      const role = getVal('usr_role');

      if (!name || !email.includes('@') || password.length < 6) {
        return showToast('Informe nome, e-mail válido e senha com 6 ou mais caracteres');
      }
      if (!(commissionRate >= 0 && commissionRate <= 100)) {
        return showToast('Percentual de comissão inválido');
      }
      if (database.users.some(u => u.email === email)) {
        return showToast('Este e-mail já está cadastrado');
      }

      database.users.push({
        id: nextId(),
        nome: name,
        email,
        h: await sha256(password),
        role,
        pct: commissionRate,
        ativo: 1
      });

      addAuditLog(`Usuário ${email} criado`);
      await saveData();
      closeModal();
      refreshView();
    }

    function updateUserCommission(userId, newPercentage) {
      if (!isAdmin()) return;
      const user = database.users.find(y => y.id === userId);
      const parsedPercentage = Number(newPercentage);

      if (!user || !(parsedPercentage >= 0 && parsedPercentage <= 100)) {
        return showToast('Percentual inválido');
      }

      user.pct = parsedPercentage;
      addAuditLog(`Comissão de ${user.nome} alterada para ${parsedPercentage}%`);
      saveData();
      showToast('Percentual atualizado.');
    }

    function toggleUserStatus(userId) {
      if (!isAdmin() || userId === currentUser.id) return;
      const user = database.users.find(x => x.id === userId);
      user.ativo = user.ativo ? 0 : 1;

      addAuditLog(`${user.ativo ? 'Ativou' : 'Desativou'} ${user.email}`);
      saveData();
      refreshView();
    }

    function confirmDeleteUser(userId) {
      if (!isAdmin()) return showToast('Apenas o administrador pode excluir usuários.');
      if (userId === currentUser.id) return showToast('Você não pode excluir o seu próprio usuário.');
      const user = database.users.find(u => u.id === userId);
      if (!user) return;

      openModal(`
        <h3>Excluir Usuário do Sistema</h3>
        <p style="font-size:14px;line-height:1.6">
          Tem certeza que deseja excluir permanentemente o usuário abaixo?

          <b style="color:#8f1122">${escapeHtml(user.nome)}</b>
          <div style="font-size:12px;color:#5a6069;margin-top:4px">E-mail: ${escapeHtml(user.email)} · Perfil: ${escapeHtml(user.role.toUpperCase())}</div>
        </div>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button onclick="deleteUser('${user.id}')">${icon('trash')} Confirmar Exclusão</button>
          <button class="secondary" onclick="closeModal()">Cancelar</button>
        </div>
      `);
    }

    async function deleteUser(userId) {
      if (!isAdmin() || userId === currentUser.id) return closeModal();
      const idx = database.users.findIndex(u => u.id === userId);
      if (idx === -1) return closeModal();

      const removed = database.users[idx];
      database.users.splice(idx, 1);
      addAuditLog(`Usuário excluído: ${removed.nome} (${removed.email})`);
      await saveData();
      closeModal();
      refreshView();
      showToast(`Usuário ${removed.nome} excluído com sucesso!`);
    }

    // =========================================================================
    // INTERFACE: cor do cabo no SKU, indicador do menu, contagem dos indicadores
    // (somente apresentação — nenhuma regra de negócio passa por aqui)
    // =========================================================================
    const CABLE_PREFIX = { VM: 'vm', PT: 'pt', AZ: 'az', VD: 'vd', BR: 'br', AM: 'am' };
    const CABLE_NAME = { vm: 'vermelho', pt: 'preto', az: 'azul', vd: 'verde', br: 'branco', am: 'amarelo' };

    // O prefixo do código é a cor da isolação (VM250100 = cabo vermelho, 2,50 mm, 100 m)
    function tagCableColors() {
      document.querySelectorAll('.sku-pill:not([data-cor])').forEach(el => {
        const match = el.textContent.trim().toUpperCase().match(/^(VM|PT|AZ|VD|BR|AM)\d/);
        const color = match ? CABLE_PREFIX[match[1]] : '';
        el.dataset.cor = color;
        if (color) el.title = `Cabo ${CABLE_NAME[color]}`;
      });
    }

    let cableTagQueued = false;
    new MutationObserver(() => {
      if (cableTagQueued) return;
      cableTagQueued = true;
      requestAnimationFrame(() => { cableTagQueued = false; tagCableColors(); });
    }).observe(document.body, { childList: true, subtree: true });

    // Pílula do menu: um único elemento que desliza até o item ativo
    function placeNavIndicator() {
      const list = document.querySelector('.nav-list');
      const indicator = list && list.querySelector('.nav-indicator');
      const active = list && list.querySelector('a.on');
      if (!indicator || !active) return;

      const firstTime = !list.classList.contains('js-ind');
      if (firstTime) indicator.style.transition = 'none';
      indicator.style.width = active.offsetWidth + 'px';
      indicator.style.height = active.offsetHeight + 'px';
      indicator.style.transform = `translate(${active.offsetLeft}px, ${active.offsetTop}px)`;
      if (firstTime) {
        list.classList.add('js-ind');
        void indicator.offsetWidth;
        indicator.style.transition = '';
      }

      // no celular o menu é horizontal: mantém o item ativo à vista
      const nav = list.parentElement;
      if (nav && nav.scrollWidth > nav.clientWidth + 2) {
        nav.scrollTo({ left: Math.max(0, active.offsetLeft - 24), behavior: 'smooth' });
      }
    }
    window.addEventListener('resize', placeNavIndicator);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeNavIndicator);

    // Indicadores do painel contam até o valor real; o texto final é sempre o original
    function animateKpis(scope) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      scope.querySelectorAll('.cards .card h3').forEach((el, index) => {
        const original = el.textContent;
        const trimmed = original.trim();
        const isMoney = /^R\$/.test(trimmed);
        if (!isMoney && !/^\d+$/.test(trimmed)) return;
        const target = parseFloat(trimmed.replace(/[^\d,-]/g, '').replace(',', '.'));
        if (!isFinite(target) || target <= 0) return;

        const format = value => isMoney ? formatCurrency(value) : String(Math.round(value));
        const startAt = performance.now() + 120 + index * 45;
        const duration = 900;
        el.textContent = format(0);

        const tick = now => {
          if (!el.isConnected) return;
          const t = Math.min(1, Math.max(0, (now - startAt) / duration));
          if (t >= 1) { el.textContent = original; return; }
          el.textContent = format(target * (1 - Math.pow(1 - t, 4)));
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }

    // Itens de menu e atalhos do topo não são <a href>: Enter/Espaço também os acionam
    document.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches &&
          event.target.matches('nav a, .pill-item, .brand-area .logo')) {
        event.preventDefault();
        event.target.click();
      }
    });

    // Inicialização: busca os dados do servidor no Render (/api/db)
    (async () => {
      try {
        const res = await fetch('/api/db');
        if (res.ok) {
          database = await res.json();
        }
      } catch (e) {
        try {
          const local = localStorage.getItem('marketlandia_db');
          if (local) database = JSON.parse(local);
        } catch (err) {}
      }

      if (!database || !Array.isArray(database.users)) {
        database = {
          seq: { o: 100, p: 2180, f: 500 },
          users: [],
          cli: [],
          prod: [],
          orc: [],
          ped: [],
          fat: [],
          com: [],
          rec: [],
          audit: [],
          cfg: { liberaApos: 1, maxDesc: 10 }
        };
      }

      // Remove automaticamente quaisquer produtos inativos legados que já estivessem salvos
      if (Array.isArray(database.prod)) {
        const beforeLen = database.prod.length;
        database.prod = database.prod.filter(isProductActive);
        if (database.prod.length !== beforeLen) {
          await saveData();
        }
      }

      let seedChanged = false;

      // Pré-carrega automaticamente todos os 988 clientes da planilha ListaClientes.xlsx se a lista estiver vazia
      if (Array.isArray(database.cli) && database.cli.length === 0) {
        const defaultSeller = database.users.find(u => u.role === 'vendedor') || database.users[0];
        SAMPLE_CLIENT_LIST.forEach(item => {
          database.cli.push({
            id: nextId(),
            ...item,
            vend: defaultSeller ? defaultSeller.id : '',
            vendNome: defaultSeller ? defaultSeller.nome : 'Thiago',
            ativo: 1
          });
        });
        seedChanged = true;
      }

      if (seedChanged) {
        await saveData();
      }

      renderApp();
    })();
  </script>
